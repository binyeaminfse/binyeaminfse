<svg width="700" height="60" viewBox="0 0 700 60" xmlns="http://www.w3.org/2000/svg">
  <style>
    .marquee-track {
      display: inline-block;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 28px;
      font-weight: 800;
      fill: #FF58C4;
      letter-spacing: 1.5px;
      /* Speed control: change duration (e.g., 14s for faster, 22s for slower) */
      animation: seamless-scroll 18s linear infinite;
    }

    @keyframes seamless-scroll {
      0% {
        transform: translateX(0);
      }
      100% {
        /* Exact offset matching the total width of the text segment */
        transform: translateX(-1900px);
      }
    }
  </style>

  <g class="marquee-track">
    <!-- First Text Instance -->
    <text x="0" y="42">
      Hi, this is Yeamin... ⚡ FullStack Developer 💻 • Crafting Modern Web Experiences. • Thanks for exploring my craft! •&#160; .then(=>)
    </text>
    
    <!-- Seamless Duplicate Instance for Infinite Loop -->
    <text x="1900" y="42">
      Hi, this is Yeamin... ⚡ FullStack Developer 💻 • Crafting Modern Web Experiences Thanks for exploring my craft! •&#160;
    </text>
  </g>
</svg>
